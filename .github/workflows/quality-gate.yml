name: GLAM Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate patched dependency lock for review
        run: npm install --package-lock-only --ignore-scripts --no-save source-map-js@1.2.2
      - name: Upload patched lock
        uses: actions/upload-artifact@v4
        with:
          name: patched-package-lock
          path: package-lock.json
      - name: Install
        run: npm ci
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Generate routes and production build
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ] && grep -q "Crawling result not available" build.log; then
            echo "TanStack route crawler returned its known transient empty result; retrying build once."
            npm run build 2>&1 | tee build-retry.log
            code=${PIPESTATUS[0]}
            cat build-retry.log >> build.log
          fi
          exit "$code"
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: build.log
      - name: Typecheck generated route tree
        run: |
          npx tsc --noEmit 2>&1 | tee typecheck.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
      - name: Regression tests
        run: npm test
      - name: Lint
        run: npm run lint
