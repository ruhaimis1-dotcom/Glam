name: GLAM Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-os/mvp-gate-2026-10-06
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Format current G3 G4 delta
        run: |
          npx prettier --write             src/repositories/staff.ts             src/routes/business.staff.tsx             tests/beauty-passport.test.mjs             tests/staff.test.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/repositories/staff.ts src/routes/business.staff.tsx tests/beauty-passport.test.mjs tests/staff.test.mjs
            git commit -m "style: format G3 G4 candidate delta"
            git push origin HEAD:agent-os/mvp-gate-2026-10-06
          fi
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Generate routes and production build
        run: npm run build
      - name: Typecheck generated route tree
        run: npx tsc --noEmit
      - name: Regression tests
        run: npm test
      - name: Lint
        run: npm run lint
