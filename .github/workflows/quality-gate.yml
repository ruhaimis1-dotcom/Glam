name: GLAM Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: |
          npx tsc --noEmit 2>&1 | tee typecheck.log
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
      - name: Regression tests
        run: node --experimental-strip-types tests/booking-time.test.mjs
      - name: Production build
        run: npm run build
