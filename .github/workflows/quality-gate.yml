name: GLAM W03 recovery and booking-date validation
on:
  push:
    branches: [agent-os/glam-r01-validation-2026-10-14]
permissions:
  contents: read
concurrency:
  group: glam-r01-isolated-validation
  cancel-in-progress: true
jobs:
  validate:
    if: github.repository == 'ruhaimis1-dotcom/Glam' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_glam_r01_synthetic_only
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare exact combined unpublished source
        id: prepare
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/agent-os/glam-r01-validation-2026-10-14'
          node -e 'if(JSON.parse(require("fs").readFileSync("vercel.json")).git.deploymentEnabled!==false)throw Error("STOP: deployment is not disabled")'
          python3 validation/prepare-w03.py
      - name: Install locked dependencies without artifacts or cache
        id: install
        run: npm ci --no-audit --no-fund
      - name: Prove application network restrictions
        id: network
        run: bash "$RUNNER_TEMP/glam-network-setup.sh"
      - name: Format touched files and record verified-source manifest
        id: format
        run: |
          export NODE_OPTIONS="--require $RUNNER_TEMP/glam-r01-network.cjs"
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {gzipSync} from 'node:zlib';
          import * as prettier from 'prettier';
          const base='7f170d211d7ef95556df343a4dd462b2b6e2b0db';
          const files=[...new Set([
            ...execFileSync('git',['diff','--name-only',base,'--','src','tests','scripts','docs'],{encoding:'utf8'}).trim().split('\n'),
            ...execFileSync('git',['ls-files','--others','--exclude-standard','src','tests','scripts','docs'],{encoding:'utf8'}).trim().split('\n'),
          ].filter(Boolean))].sort();
          const manifest={}; const newSources={};
          for(const path of files){
            let source=fs.readFileSync(path,'utf8');
            if(/\.(mjs|ts|tsx)$/.test(path)){
              source=await prettier.format(source,{...(await prettier.resolveConfig(path)),filepath:path});
              fs.writeFileSync(path,source);
            }
            manifest[path]=crypto.createHash('sha256').update(source).digest('hex');
            if(/recovery|post-login|supabase\.ts|auth\.confirm|reset-password|login\.tsx|salon\.\$salonId\.book/.test(path))newSources[path]=source;
          }
          console.log('W03_SOURCE_MANIFEST: '+JSON.stringify(manifest));
          console.log('PRETTIER_VERSION: '+prettier.version);
          const raw=Buffer.from(JSON.stringify(newSources));
          console.log('W03_SOURCE_PAYLOAD_SHA256: '+crypto.createHash('sha256').update(raw).digest('hex'));
          const payload=gzipSync(raw).toString('base64');
          for(let i=0;i<payload.length;i+=2500)console.log('W03_SOURCE_CHUNK_'+(i/2500)+': '+payload.slice(i,i+2500));
          JS
      - name: All regression and recovery unit tests
        if: always() && steps.format.outcome == 'success'
        run: |
          export NODE_OPTIONS="--require $RUNNER_TEMP/glam-r01-network.cjs"
          npm test
      - name: Full application build
        id: build
        if: always() && steps.format.outcome == 'success'
        run: |
          export NODE_OPTIONS="--require $RUNNER_TEMP/glam-r01-network.cjs"
          npm run build
      - name: Full TypeScript check
        if: always() && steps.build.outcome == 'success'
        run: |
          export NODE_OPTIONS="--require $RUNNER_TEMP/glam-r01-network.cjs"
          npm run typecheck
      - name: Full lint
        if: always() && steps.format.outcome == 'success'
        run: |
          export NODE_OPTIONS="--require $RUNNER_TEMP/glam-r01-network.cjs"
          npm run lint
      - name: Real isolated PostgreSQL admin regression
        if: always() && steps.format.outcome == 'success'
        run: |
          set -euo pipefail
          pg_bin=''
          for candidate in /usr/lib/postgresql/*/bin; do
            if test -x "$candidate/initdb" && test -x "$candidate/pg_ctl" && test -x "$candidate/psql"; then pg_bin="$candidate"; fi
          done
          test -n "$pg_bin" || { echo 'BLOCKED: no preinstalled PostgreSQL'; exit 1; }
          export NODE_OPTIONS="--require $RUNNER_TEMP/glam-r01-network.cjs"
          node scripts/test-glam-admin-r01-postgres.mjs --pg-bin "$pg_bin"
      - name: R02 admin and navigation real-browser regression
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 3
        run: |
          export NODE_OPTIONS="--require $RUNNER_TEMP/glam-r01-network.cjs"
          node tests/e2e/r02-validation-browser.mjs
      - name: W03 recovery, identity isolation, role routes and Riyadh date in real browser
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 4
        run: |
          export NODE_OPTIONS="--require $RUNNER_TEMP/glam-r01-network.cjs"
          node tests/e2e/recovery-w03.mjs
      - name: Record limitations
        if: always()
        run: |
          echo 'Synthetic local Auth/HTTP only. No emails delivered or real passwords changed.'
          echo 'No hosted Supabase, production writes, deploy, merge, SCCC, artifacts or cache.'
          echo 'Browser tests and SQL tests are separate; NOT an end-to-end hosted persistence test.'
