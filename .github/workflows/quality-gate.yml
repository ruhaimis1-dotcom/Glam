name: GLAM Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Regression tests
        shell: bash
        run: |
          if [ -f tests/booking-time.test.mjs ]; then
            node --experimental-strip-types tests/booking-time.test.mjs
          else
            echo "No booking regression test on this branch yet."
          fi
      - name: Production build
        run: npm run build
